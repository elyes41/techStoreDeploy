# ---------- Base de données MongoDB ----------
# La structure (validateurs, index) est dans resources/mongo et appliquée au démarrage (MongoSetup).
# Par défaut : le conteneur « mongo » de docker-compose (docker compose up -d mongo)
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://techstore:techstore@localhost:27017/?authSource=admin}
quarkus.mongodb.database=${MONGODB_DATABASE:techstore}
quarkus.mongodb.devservices.enabled=false

# ---------- HTTP ----------
# PORT est fourni par les hébergeurs PaaS (Render…)
quarkus.http.port=${PORT:8080}
quarkus.http.limits.max-body-size=10M
quarkus.http.cors.enabled=${CORS_ENABLED:false}
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}

# ---------- JWT (admin) ----------
# En production : générez vos propres clés (voir README) et pointez ces variables vers elles
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://techstore.tn}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY:privateKey.pem}

# ---------- Boutique ----------
shop.issuer=${JWT_ISSUER:https://techstore.tn}
shop.token-ttl=PT12H
shop.shipping-fee=8.000
shop.free-shipping-threshold=500.000
shop.fiscal-stamp=1.000
shop.low-stock-threshold=5
shop.upload-dir=${UPLOAD_DIR:uploads}
# disk (VPS, Docker) ou mongo (GridFS : hébergeurs sans disque persistant)
shop.storage=${STORAGE:disk}
# Bouton « Commander sur WhatsApp » (format 216XXXXXXXX, vide = masqué)
shop.whatsapp-number=${WHATSAPP_NUMBER:}
# Données de démonstration insérées si la base est vide (mettre DEMO_DATA=false en production)
shop.demo-data=${DEMO_DATA:true}

# Compte administrateur créé au premier démarrage si aucun n'existe
shop.admin.email=${ADMIN_EMAIL:admin@techstore.tn}
shop.admin.password=${ADMIN_PASSWORD:ChangeMoi123!}
shop.admin.full-name=${ADMIN_NAME:Administrateur}

# ---------- E-mails ----------
# En mode dev (mvn quarkus:dev) les e-mails ne partent pas : ils s'affichent dans la console.
shop.public-url=${PUBLIC_URL:http://localhost}
quarkus.mailer.from=${MAIL_FROM:TechStore <no-reply@techstore.tn>}
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USER:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.start-tls=${SMTP_STARTTLS:OPTIONAL}
quarkus.mailer.tls=${SMTP_SSL:false}
%prod.quarkus.mailer.mock=${MAIL_MOCK:false}
# Si renseignée : envoi par l'API HTTP Brevo au lieu du SMTP (Render Free bloque les ports SMTP)
shop.brevo-api-key=${BREVO_API_KEY:}

# ---------- Docs API ----------
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=TechStore API
